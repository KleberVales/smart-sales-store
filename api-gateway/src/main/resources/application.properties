# Server
server.port=8080

# Application
spring.application.name=api-gateway

# Gateway Routes
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=http://service-auth:8081
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**
spring.cloud.gateway.routes[0].filters[0].name=CircuitBreaker
spring.cloud.gateway.routes[0].filters[0].args.name=authService
spring.cloud.gateway.routes[0].filters[0].args.fallbackUri=forward:/fallback/auth
spring.cloud.gateway.routes[0].filters[1]=StripPrefix=0

spring.cloud.gateway.routes[1].id=user-service
spring.cloud.gateway.routes[1].uri=http://service-user:8082
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/users/**
spring.cloud.gateway.routes[1].filters[0].name=CircuitBreaker
spring.cloud.gateway.routes[1].filters[0].args.name=userService
spring.cloud.gateway.routes[1].filters[0].args.fallbackUri=forward:/fallback/users
spring.cloud.gateway.routes[1].filters[1]=StripPrefix=0

# Security
jwt.secret=your-secret-key-must-be-at-least-32-characters-long
spring.security.jwt.expiration=86400000

# Actuator
management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.gateway.enabled=true

# Logging
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.com.kvales.gateway=DEBUG