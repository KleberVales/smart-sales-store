version: '3.8'

services:

  # service-user database
  user-db:
    image: postgres:16-alpine
    container_name: user-db
    environment:
      POSTGRES_DB: ${USER_DB_NAME}
      POSTGRES_USER: ${USER_DB_USERNAME}
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD}
    ports:
      - "5435:5432"
    volumes:
      - user_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_service -d user_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - smart-sales-net

  # Users microservice
  service-user:
    build:
      context: ./service-user
      dockerfile: Dockerfile
    container_name: service-user
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://user-db:5432/user_db
      SPRING_DATASOURCE_USERNAME: ${USER_DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${USER_DB_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      user-db:
        condition: service_healthy
    networks:
      - smart-sales-net


  # Authentication microservice
  service-auth:
    build:
      context: ./service-auth
      dockerfile: Dockerfile
    container_name: service-auth
    ports:
      - "8081:8081"
    environment:
      - SERVICE_USER_URL=http://service-user:8082
    depends_on:
      - service-user
    networks:
      - smart-sales-net


  # API Gateway
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      - AUTH_SERVICE_URL=http://service-auth:8081
      - USER_SERVICE_URL=http://service-user:8082
      - CUSTOMERS_SERVICE_URL=http://service-customers:8083
      - PRODUCTS_SERVICE_URL=http://service-products:8084
    depends_on:
      - service-auth
      - service-user
      - service-customers
      - service-products
    networks:
      - smart-sales-net


  # service-customers database
  customers-db:
    image: postgres:16-alpine
    container_name: customers-db
    environment:
      POSTGRES_DB: ${CUSTOMERS_DB_NAME}
      POSTGRES_USER: ${CUSTOMERS_DB_USERNAME}
      POSTGRES_PASSWORD: ${CUSTOMERS_DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - customers_db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U customers_service -d customers_db" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - smart-sales-net


  # Customers microservice
  service-customers:
    build:
      context: ./service-customers
      dockerfile: Dockerfile
    container_name: service-customers
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://customers-db:5432/customers_db
      SPRING_DATASOURCE_USERNAME: ${CUSTOMERS_DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${CUSTOMERS_DB_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      customers-db:
        condition: service_healthy
    networks:
      - smart-sales-net


    # database do service-products
  product-db:
    image: postgres:16-alpine
    container_name: product-db
    environment:
      POSTGRES_DB: ${PRODUCT_DB_NAME}
      POSTGRES_USER: ${PRODUCT_DB_USERNAME}
      POSTGRES_PASSWORD: ${PRODUCT_DB_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - product_db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user_products -d smart_sales_products" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - smart-sales-net

    # microsserviço de produtos
  service-products:
    build:
      context: ./service-products
      dockerfile: Dockerfile
    container_name: service-products
    ports:
      - "8084:8084"
    environment:
        SPRING_DATASOURCE_URL: jdbc:postgresql://product-db:5432/smart_sales_products
        DB_USERNAME: ${PRODUCT_DB_USERNAME}
        DB_PASSWORD: ${PRODUCT_DB_PASSWORD}
        SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      product-db:
        condition: service_healthy
    networks:
      - smart-sales-net

networks:
  smart-sales-net:
    driver: bridge

volumes:
  user_db_data:
  customers_db_data:
  product_db_data: